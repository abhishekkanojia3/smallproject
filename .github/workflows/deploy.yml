name: Deploy to S3 + CloudFront

on:
  push:
    branches: [dev]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build static site
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Sync to S3
        run: |
          # Upload HTML files with no-cache to ensure fresh content
          aws s3 sync out/ s3://techrunniti.com --delete --exclude "*.js" --exclude "*.css" --exclude "*.json" --exclude "*.woff*" --exclude "*.png" --exclude "*.jpg" --exclude "*.jpeg" --exclude "*.svg" --exclude "*.gif" --cache-control "public, no-cache, no-store, must-revalidate"
          # Upload hashed assets with long cache (1 year)
          aws s3 sync out/ s3://techrunniti.com --exclude "*" --include "*.js" --include "*.css" --include "*.woff*" --include "*.png" --include "*.jpg" --include "*.jpeg" --include "*.svg" --include "*.gif" --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DIST_ID }} --paths "/*"
